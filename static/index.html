<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BitsCore Health Monitor</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a192f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(420px, 85%);
      padding: 32px;
      border: 1px solid #64ffda;
      border-radius: 24px;
      background: #112240;
    }

    .status {
      color: #64ffda;
      font-size: 2rem;
      font-weight: bold;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="card">
    <p>Engenharia de Bits</p>
    <h1>BitsCore Health Monitor</h1>

    <p class="status" id="status">Verificando...</p>
    <p id="service"></p>
    <p id="uptime"></p>
    <p id="requestId"></p>

    <button id="refresh">Verificar novamente</button>
  </main>

  <script>
    async function checkHealth() {
      const status = document.querySelector("#status");
      status.textContent = "Verificando...";

      try {
        const response = await fetch("/api/health");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        status.textContent = "● Sistema online";
        document.querySelector("#service").textContent =
          `${data.service} — versão ${data.version}`;

        document.querySelector("#uptime").textContent =
          `Uptime: ${data.uptime_seconds} segundos`;

        document.querySelector("#requestId").textContent =
          `Request ID: ${data.request_id}`;
      } catch (error) {
        status.textContent = "● Sistema indisponível";
        document.querySelector("#service").textContent = error.message;
      }
    }

    document
      .querySelector("#refresh")
      .addEventListener("click", checkHealth);

    checkHealth();
  </script>
</body>
</html>

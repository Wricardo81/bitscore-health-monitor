<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BitsCore Health Monitor</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a192f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(420px, 85%);
      padding: 32px;
      border: 1px solid #64ffda;
      border-radius: 24px;
      background: #112240;
    }

    .status {
      color: #64ffda;
      font-size: 2rem;
      font-weight: bold;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
      cursor: pointer;
    }

    .usage-card {
    margin: 24px 0;
    padding: 20px;
    border-radius: 18px;
    background: #0a192f;
    }

    .meter {
    height: 14px;
    overflow: hidden;
    border-radius: 999px;
    background: #233554;
    }

    .meter-fill {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: #64ffda;
    transition: width 0.3s ease;
    }

    .warning {
    color: #ffd166;
    }

    .blocked {
    color: #ff6b6b;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>
  <main class="card">
    <p>Engenharia de Bits</p>
    <h1>BitsCore Health Monitor</h1>

    <p class="status" id="status">Verificando...</p>
    <p id="service"></p>
    <p id="uptime"></p>
    <p id="requestId"></p>

    <section class="usage-card">
        <h2>Consumo do plano</h2>

        <p id="usageText">Carregando...</p>

        <div class="meter">
            <div class="meter-fill" id="meterFill"></div>
        </div>

        <p id="usageAlert"></p>

        <button id="consume">Simular novo pedido</button>
        <button id="upgrade" hidden>Fazer upgrade</button>
    </section>

    <section class="usage-card">
        <h2>Historico de assinatura</h2>
        <label for="auditActorFilter">
            Responsavel
        </label>
        <select id="auditActorFilter">
            <option value="">Todos</option>
            <option value="customer">Cliente</option>
            <option value="admin">Administracao</option>
            <option value="system">Sistema</option>
        </select>

        <label for="auditDateFrom">
            Data inicial
        </label>
        <input
            id="auditDateFrom"
            type="date"
        >

        <label for="auditDateTo">
            Data final
        </label>
        <input
            id="auditDateTo"
            type="date"
        >
        <button
            id="applyAuditFilter"
            type="button"
        >
            Aplicar filtro
        </button>

        <p id="subscriptionAuditStatus">
            Carregando historico...
        </p>
        <div id="subscriptionAuditList"></div>
        <button
            id="loadMoreAudit"
            type="button"
            hidden
        >
            Carregar mais
        </button>

        <button
            id="exportAudit"
            type="button"
        >
            Exportar CSV
        </button>
    </section>

    <button id="refresh">Verificar novamente</button>
  </main>

  <script>
    async function checkHealth() {
      const status = document.querySelector("#status");
      status.textContent = "Verificando...";

      try {
        const response = await fetch("/api/health");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        status.textContent = "● Sistema online";
        document.querySelector("#service").textContent =
          `${data.service} — versão ${data.version}`;

        document.querySelector("#uptime").textContent =
          `Uptime: ${data.uptime_seconds} segundos`;

        document.querySelector("#requestId").textContent =
          `Request ID: ${data.request_id}`;
      } catch (error) {
        status.textContent = "● Sistema indisponível";
        document.querySelector("#service").textContent = error.message;
      }
    }

    document
      .querySelector("#refresh")
      .addEventListener("click", checkHealth);

    checkHealth();

    function renderUsage(data) {
    document.querySelector("#usageText").textContent =
        `${data.tenant_id} | Plano ${data.plan}: ${data.used} de ${data.limit} pedidos`;

    const meter = document.querySelector("#meterFill");
    meter.style.width = `${Math.min(data.percentage, 100)}%`;

    const alert = document.querySelector("#usageAlert");
    const button = document.querySelector("#consume");
    const upgradeButton = document.querySelector("#upgrade");

    alert.className = "";
    button.disabled = false;
    upgradeButton.hidden = true;
    upgradeButton.dataset.plan = "";

    if (data.alert_level === "blocked") {
        alert.textContent = "Limite atingido — upgrade necessário.";
        if (data.recommended_plan) {
            alert.textContent += ` Plano recomendado: ${data.recommended_plan}.`;
        }
        alert.className = "blocked";
        meter.style.background = "#ff6b6b";
        button.disabled = true;
        upgradeButton.hidden = !data.recommended_plan;
        upgradeButton.dataset.plan =
            data.recommended_plan || "";
    } else if (data.alert_level === "warning") {
        alert.textContent = "Atenção: mais de 80% do plano utilizado.";
        if (data.recommended_plan) {
            alert.textContent += ` Considere o plano ${data.recommended_plan}.`;
        }
        alert.className = "warning";
        meter.style.background = "#ffd166";
    } else {
        alert.textContent = "Consumo dentro do limite.";
        meter.style.background = "#64ffda";
    }
    }

    let auditOffset = 0;
    const auditLimit = 10;

    function auditActorFilter() {
    return document
        .querySelector("#auditActorFilter")
        .value;
    }

    function buildAuditQuery() {
    const parameters = new URLSearchParams({
        limit: auditLimit,
        offset: auditOffset
    });

    const actorType = auditActorFilter();

    if (actorType) {
        parameters.set("actor_type", actorType);
    }

    const dateFrom = document
        .querySelector("#auditDateFrom")
        .value;

    const dateTo = document
        .querySelector("#auditDateTo")
        .value;

    if (dateFrom) {
        parameters.set("date_from", dateFrom);
    }

    if (dateTo) {
        parameters.set("date_to", dateTo);
    }

    return parameters.toString();
    }

    async function loadSubscriptionAudit(reset = true) {
    const status = document.querySelector(
        "#subscriptionAuditStatus"
    );

    const list = document.querySelector(
        "#subscriptionAuditList"
    );

    const loadMoreButton = document.querySelector(
        "#loadMoreAudit"
    );

    if (reset) {
        auditOffset = 0;
        list.replaceChildren();
        loadMoreButton.hidden = true;
    }

    loadMoreButton.disabled = true;

    try {
        const response = await fetch(
            "/api/subscription/events?" +
            buildAuditQuery()
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || `HTTP ${response.status}`
            );
        }

        if (data.pagination.total === 0) {
            status.textContent =
                "Nenhuma alteracao de plano registrada.";
            loadMoreButton.hidden = true;
            return;
        }

        status.textContent =
            `${data.pagination.total}` +
            " alteracao(oes) registrada(s).";

        for (const event of data.events) {
            const item = document.createElement("p");
            item.dataset.eventId = event.id;

            const date = new Date(
                event.created_at
            ).toLocaleString("pt-BR");

            item.textContent =
                `${event.previous_plan} para ${event.new_plan}` +
                ` | ${event.previous_limit} para` +
                ` ${event.new_limit} pedidos` +
                ` | ${event.actor_type}: ${event.actor_id}` +
                ` | ${date}`;

            list.appendChild(item);
        }

        loadMoreButton.hidden =
            !data.pagination.has_more;

        if (
            data.pagination.next_offset !== null
        ) {
            auditOffset =
                data.pagination.next_offset;
        }
    } catch (error) {
        status.textContent =
            `Falha ao carregar historico: ${error.message}`;
        loadMoreButton.hidden = true;
    } finally {
        loadMoreButton.disabled = false;
    }
    }

    document
    .querySelector("#loadMoreAudit")
    .addEventListener("click", () => {
        loadSubscriptionAudit(false);
    });

    document
    .querySelector("#applyAuditFilter")
    .addEventListener("click", () => {
        loadSubscriptionAudit(true);
    });

    function exportSubscriptionAudit() {
        const parameters = new URLSearchParams();
        const actorType = auditActorFilter();

        if (actorType) {
            parameters.set("actor_type", actorType);
        }

        const dateFrom = document
            .querySelector("#auditDateFrom")
            .value;

        const dateTo = document
            .querySelector("#auditDateTo")
            .value;

        if (dateFrom) {
            parameters.set("date_from", dateFrom);
        }

        if (dateTo) {
            parameters.set("date_to", dateTo);
        }

        const query = parameters.toString();

        window.location.href =
            "/api/subscription/events/export" +
            (query ? `?${query}` : "");
    }

    document
    .querySelector("#exportAudit")
    .addEventListener(
        "click",
        exportSubscriptionAudit
    );

    async function loadUsage() {
    const response = await fetch("/api/usage");
    const data = await response.json();
    renderUsage(data);
    }

    async function consumeUsage() {
    const idempotencyKey = crypto.randomUUID();

    const response = await fetch("/api/usage/consume", {
        method: "POST",
        headers: {
            "Idempotency-Key": idempotencyKey
        }
    });

    const data = await response.json();

    if (data.usage) {
        renderUsage(data.usage);
        return;
    }

    renderUsage(data);
    }

    async function upgradePlan() {
    const button = document.querySelector("#upgrade");
    const plan = button.dataset.plan;

    if (!plan) {
        return;
    }

    button.disabled = true;
    button.textContent = "Atualizando...";

    try {
        const response = await fetch("/api/usage/upgrade", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                plan,
                actor_type: "customer",
                actor_id: "self-service-dashboard"
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || `HTTP ${response.status}`
            );
        }

        renderUsage(data.tenant);
        await loadSubscriptionAudit();
    } catch (error) {
        document.querySelector("#usageAlert").textContent =
            `Falha no upgrade: ${error.message}`;
    } finally {
        button.disabled = false;
        button.textContent = "Fazer upgrade";
    }
    }

    document
    .querySelector("#consume")
    .addEventListener("click", consumeUsage);

    document
    .querySelector("#upgrade")
    .addEventListener("click", upgradePlan);

    loadUsage();
    loadSubscriptionAudit();
  </script>
</body>
</html>
